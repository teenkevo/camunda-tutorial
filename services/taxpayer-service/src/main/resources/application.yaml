server:
  port: 8083

spring:
  application:
    name: taxpayer-service
  datasource:
    url: ${TAXPAYER_JDBC_URL:${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${TAXPAYER_DB_USER:TAXPAYER_SERVICE}
    password: ${TAXPAYER_DB_PASSWORD:Taxpayer_Pass_1}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  sensitivity:
    protection:
      enabled: true
      response-mode: MASK
      mask-value: "********"
      protected-types:
        - PII
      block-entity-responses: true
  governance:
    catalog:
      publish-on-startup: true
      service-name: taxpayer-service
      base-url: http://localhost:8081
      scan-packages: com.example.taxpayer
      fail-on-error: false
      fail-on-non-compliant: false
  camunda:
    base-url: http://localhost:8080
