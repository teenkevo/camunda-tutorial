server:
  port: 8080

spring:
  application:
    name: camunda-service
  datasource:
    url: jdbc:h2:mem:camunda-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  services:
    refund-base-url: http://localhost:8082
    taxpayer-base-url: http://localhost:8083

camunda.bpm:
  database:
    schema-update: true
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  filter:
    create: All tasks
  generic-properties:
    properties:
      historyTimeToLive: 30
