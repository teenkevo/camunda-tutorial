spring:
  datasource:
    url: jdbc:h2:mem:governance-test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  governance:
    naming:
      enforce: true
      domains:
        - id: refunds
          table-prefix: REFUND_
          services:
            - refund-service
        - id: taxpayer-registration
          table-prefix: REGISTRATION_
          services:
            - registration-service
