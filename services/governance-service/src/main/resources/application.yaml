server:
  port: 8081

spring:
  application:
    name: governance-service
  datasource:
    url: ${GOVERNANCE_JDBC_URL:${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${GOVERNANCE_DB_USER:GOVERNANCE_SERVICE}
    password: ${GOVERNANCE_DB_PASSWORD:Governance_Pass_1}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    com.example.governance: INFO

# Allow-listed data domains and physical table naming. Entities outside this fail conformance.
app:
  governance:
    naming:
      enforce: true
      domains:
        - id: refunds
          label: Refunds
          table-prefix: RFND_
          services:
            - refund-service
        - id: taxpayer-registration
          label: Taxpayer registration
          table-prefix: REG_
          table-pattern: "^REG_[A-Z0-9_]+$"
          services:
            - taxpayer-service
        - id: governance
          label: Governance catalog
          table-prefix: GOV_
          services:
            - governance-service
    openmetadata:
      enabled: true
      require-registry-attributes: true
      base-url: ${OPENMETADATA_API_URL:http://localhost:8585/api}
      username: ${OPENMETADATA_USER:admin}
      password: ${OPENMETADATA_PASSWORD:admin}
      glossary-name: GovernedAssets
      # Do not auto-create glossary terms / classifications in OpenMetadata on startup
      seed: false
      service-refresh-urls:
        refund-service: http://localhost:8082
        taxpayer-service: http://localhost:8083
