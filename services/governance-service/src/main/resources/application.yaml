server:
  port: 8081

spring:
  application:
    name: governance-service
  datasource:
    url: ${GOVERNANCE_JDBC_URL:${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${GOVERNANCE_DB_USER:GOVERNANCE_SERVICE}
    password: ${GOVERNANCE_DB_PASSWORD:Governance_Pass_1}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    com.example.governance: INFO

# Allow-listed data domains and physical table naming. Entities outside this fail conformance.
app:
  governance:
    catalog:
      service-name: governance-service
      base-url: ${GOVERNANCE_URL:http://localhost:8081}
      # Self-publish identity + apply Oracle COMMENT ON from @Comment
      publish-on-startup: true
      fail-on-error: false
      fail-on-non-compliant: false
      scan-packages: com.example.governance.service
    naming:
      enforce: true
      domains:
        - id: refunds
          label: Refunds
          table-prefix: REFUND_
          services:
            - refund-service
        - id: taxpayer-registration
          label: Taxpayer registration
          table-prefix: REGISTRATION_
          table-pattern: "^REGISTRATION_[A-Z0-9_]+$"
          services:
            - registration-service
        - id: governance
          label: Governance catalog
          table-prefix: GOVERNANCE_
          services:
            - governance-service
        - id: documents
          label: Documents
          table-prefix: DOCUMENT_
          table-pattern: "^DOCUMENT_[A-Z0-9_]+$"
          services:
            - document-service
    openmetadata:
      enabled: true
      # Only enforced when an assetId is present on a synced entity row
      require-registry-attributes: false
      base-url: ${OPENMETADATA_API_URL:http://localhost:8585/api}
      username: ${OPENMETADATA_USER:admin}
      password: ${OPENMETADATA_PASSWORD:admin}
      glossary-name: GovernedAssets
      # Do not auto-create glossary terms / classifications in OpenMetadata on startup
      seed: false
      service-refresh-urls:
        refund-service: http://localhost:8082
        registration-service: http://localhost:8083
        document-service: http://localhost:8085
