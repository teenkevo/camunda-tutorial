spring:
  application:
    name: governance-service
  datasource:
    url: jdbc:h2:file:./data/governance-catalog;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081

logging:
  level:
    com.example.governance: INFO
