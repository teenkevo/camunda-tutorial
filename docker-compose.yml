# Local Oracle AI Database Free (26ai-compatible JDBC: ojdbc17 23.26.x).
# After the DB is healthy, create service schemas:
#   docker compose exec oracle sqlplus system/Oracle_Pass_1@//localhost:1521/FREEPDB1 @/opt/oracle/scripts/startup/01-create-schemas.sql
# Or mount-run the script once SYS/SYSTEM can connect to FREEPDB1.

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: camunda-tutorial-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: Oracle_Pass_1
      APP_USER: bootstrap
      APP_USER_PASSWORD: Bootstrap_Pass_1
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Only init/*.sh — SQL under db/oracle is for manual sqlplus (must ALTER SESSION to FREEPDB1)
      - ./db/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  oracle-data:
