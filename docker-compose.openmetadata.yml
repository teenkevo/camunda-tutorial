# OpenMetadata stack (MySQL + Elasticsearch + migrate + server + ingestion/Airflow).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.openmetadata.yml up -d
# UI:        http://localhost:8585  (admin / admin)
# Airflow:   http://localhost:8084  (admin / admin)
#
# Oracle from ingestion containers: host.docker.internal:1521  service FREEPDB1

volumes:
  openmetadata-mysql-data:
  openmetadata-es-data:
  openmetadata-ingestion-dags:
  openmetadata-ingestion-dag-airflow:
  openmetadata-ingestion-tmp:

networks:
  openmetadata_net:
    name: camunda-tutorial-openmetadata

x-openmetadata-common-environment: &openmetadata-common-environment
  OPENMETADATA_CLUSTER_NAME: openmetadata
  SERVER_PORT: 8585
  SERVER_ADMIN_PORT: 8586
  LOG_LEVEL: INFO
  AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
  AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
  AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
  AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
  AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
  AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
  AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: "false"
  AUTHORIZER_ENABLE_SECURE_SOCKET: "false"
  AUTHENTICATION_PROVIDER: basic
  AUTHENTICATION_RESPONSE_TYPE: id_token
  AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
  AUTHENTICATION_AUTHORITY: https://accounts.google.com
  AUTHENTICATION_CLIENT_ID: ""
  AUTHENTICATION_CALLBACK_URL: ""
  AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[email,preferred_username,sub]"
  AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
  AUTHENTICATION_CLIENT_TYPE: public
  RSA_PUBLIC_KEY_FILE_PATH: "./conf/public_key.der"
  RSA_PRIVATE_KEY_FILE_PATH: "./conf/private_key.der"
  JWT_ISSUER: "open-metadata.org"
  JWT_KEY_ID: "Gb389a-9f76-gdjs-a92j-0242bk94356"
  PIPELINE_SERVICE_CLIENT_ENABLED: "true"
  PIPELINE_SERVICE_CLIENT_CLASS_NAME: "org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient"
  PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
  PIPELINE_SERVICE_CLIENT_HEALTH_CHECK_INTERVAL: 300
  PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
  PIPELINE_SERVICE_CLIENT_SSL_CERT_PATH: ""
  PIPELINE_SERVICE_IP_INFO_ENABLED: "false"
  PIPELINE_SERVICE_CLIENT_HOST_IP: ""
  PIPELINE_SERVICE_CLIENT_SECRETS_MANAGER_LOADER: "noop"
  AIRFLOW_USERNAME: admin
  AIRFLOW_PASSWORD: admin
  AIRFLOW_TIMEOUT: 60
  SERVER_HOST_API_URL: http://openmetadata-server:8585/api
  DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
  DB_SCHEME: mysql
  DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  DB_USE_SSL: "false"
  DB_USER: openmetadata_user
  DB_USER_PASSWORD: openmetadata_password
  DB_HOST: openmetadata-mysql
  DB_PORT: 3306
  OM_DATABASE: openmetadata_db
  ELASTICSEARCH_HOST: openmetadata-elasticsearch
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_SCHEME: http
  ELASTICSEARCH_USER: ""
  ELASTICSEARCH_PASSWORD: ""
  SEARCH_TYPE: elasticsearch
  ELASTICSEARCH_CLUSTER_ALIAS: openmetadata
  ELASTICSEARCH_CONNECTION_TIMEOUT_SECS: 5
  ELASTICSEARCH_SOCKET_TIMEOUT_SECS: 60
  ELASTICSEARCH_BATCH_SIZE: 100
  ELASTICSEARCH_PAYLOAD_BYTES_SIZE: 10485760
  ELASTICSEARCH_INDEX_MAPPING_LANG: EN
  EVENT_MONITOR: prometheus
  EVENT_MONITOR_BATCH_SIZE: 10
  SECRET_MANAGER: db
  FERNET_KEY: jJ/9sz0g0OHxsfxOoSfdFdmk3ysNmPRnH3TUAbz3IHA=
  OPENMETADATA_HEAP_OPTS: "-Xmx1G -Xms1G"
  MASK_PASSWORDS_API: "false"

services:
  openmetadata-mysql:
    container_name: camunda-tutorial-openmetadata-mysql
    image: docker.getcollate.io/openmetadata/db:1.5.11
    command: "--sort_buffer_size=10M"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - openmetadata-mysql-data:/var/lib/mysql
    networks:
      - openmetadata_net
    healthcheck:
      test: mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --silent --execute "use openmetadata_db"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  openmetadata-elasticsearch:
    container_name: camunda-tutorial-openmetadata-es
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - openmetadata-es-data:/usr/share/elasticsearch/data
    networks:
      - openmetadata_net
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  openmetadata-migrate:
    container_name: camunda-tutorial-openmetadata-migrate
    image: docker.getcollate.io/openmetadata/server:1.5.11
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      <<: *openmetadata-common-environment
      MIGRATION_LIMIT_PARAM: 1200
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
    networks:
      - openmetadata_net

  openmetadata-server:
    container_name: camunda-tutorial-openmetadata
    image: docker.getcollate.io/openmetadata/server:1.5.11
    restart: unless-stopped
    environment:
      <<: *openmetadata-common-environment
    ports:
      - "8585:8585"
      - "8586:8586"
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
      openmetadata-ingestion:
        condition: service_started
    networks:
      - openmetadata_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8585/api/v1/system/version"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s

  # Airflow-based pipeline runner (Test Connection + metadata ingest).
  # Host port 8084 — 8080 is used by camunda-service.
  openmetadata-ingestion:
    container_name: camunda-tutorial-openmetadata-ingestion
    image: docker.getcollate.io/openmetadata/ingestion:1.5.11
    restart: unless-stopped
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_started
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      AIRFLOW_DB: airflow_db
      DB_SCHEME: mysql+pymysql
      DB_USER: airflow_user
      DB_PASSWORD: airflow_pass
      DB_PROPERTIES: ""
    entrypoint: /bin/bash
    command:
      - "/opt/airflow/ingestion_dependency.sh"
    ports:
      - "8084:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openmetadata-ingestion-dag-airflow:/opt/airflow/dag_generated_configs
      - openmetadata-ingestion-dags:/opt/airflow/dags
      - openmetadata-ingestion-tmp:/tmp
    networks:
      - openmetadata_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
