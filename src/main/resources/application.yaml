spring:
  datasource:
    url: jdbc:h2:mem:camunda-tutorial;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Sensitivity / PII protection (OpenMetadata reads [PII] from DB remarks separately)
app:
  sensitivity:
    protection:
      enabled: true
      # MASK → "********" | OMIT → drop property / map as null
      response-mode: MASK
      mask-value: "********"
      # Default threshold is PII only; add SENSITIVE and/or INTERNAL to widen
      protected-types:
        - PII
      block-entity-responses: true

camunda.bpm:
  database:
    schema-update: true
  generic-properties:
    properties:
      historyTimeToLive: 30
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  filter:
    create: All tasks
